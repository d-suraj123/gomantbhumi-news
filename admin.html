<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | गोमंतभूमी</title><link rel="stylesheet" href="/style.css"><style>.panel{max-width:760px;margin:25px auto;background:white;padding:22px;border:1px solid #e5e7ea}.field{display:grid;gap:6px;margin:13px 0}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d5d8dc;border-radius:3px;font:inherit}.field textarea{min-height:160px}.btn{background:#a51e25;color:white;border:0;padding:11px 16px;font-weight:bold;cursor:pointer}.btn.secondary{background:#586574}.msg{font-size:13px;color:#a51e25}.row{display:flex;gap:10px;flex-wrap:wrap}.item{border-top:1px solid #eee;padding:12px 0}.item button{margin:6px 6px 6px 0}.status{font-size:12px;padding:3px 8px;border-radius:12px;background:#eee}</style></head><body><header class="wrap mast"><a class="brand" href="/"><span class="mark">गो</span><span><b>गोमंतभूमी</b><small>ADMIN DASHBOARD</small></span></a><a href="/">वेबसाइट पाहा</a></header><main class="wrap"><div class="panel"><h1>Admin Dashboard</h1><p class="muted">एकमेव Admin लॉगिन करून बातम्या व्यवस्थापित करा.</p><section id="login"><div class="field"><label>Admin Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">लॉगिन</button></section><section id="dashboard" hidden><h2 id="formHeading">नवीन बातमी लिहा</h2><form id="postForm"><input id="editId" type="hidden"><div class="field"><label>बातमीचे शीर्षक *</label><input id="title" required maxlength="180"></div><div class="field"><label>URL Slug (रिकामे ठेवल्यास आपोआप तयार होईल)</label><input id="slug" placeholder="goa-latest-news"></div><div class="field"><label>विभाग *</label><select id="category"><option>गोवा</option><option>कोकण</option><option>महाराष्ट्र</option><option>राजकारण</option><option>गुन्हे</option><option>व्यवसाय</option><option>शिक्षण</option><option>पर्यटन</option><option>क्रीडा</option><option>देश</option><option>विदेश</option></select></div><div class="field"><label>बातमीचा सारांश</label><textarea id="summary" rows="3" maxlength="400"></textarea></div><div class="field"><label>संपूर्ण बातमी *</label><textarea id="content" required></textarea></div><div class="field"><label>फोटो URL (प्रत्यक्ष फोटो लिंक)</label><input id="image" type="url" placeholder="https://..."></div><div class="field"><label>व्हिडिओ URL (YouTube इ.)</label><input id="video" type="url" placeholder="https://youtube.com/..."></div><div class="field"><label>बातमीची स्थिती</label><select id="status"><option value="published">प्रकाशित करा</option><option value="draft">Draft म्हणून जतन करा</option></select></div><div class="row"><button class="btn" id="saveBtn" type="submit">बातमी प्रकाशित करा</button><button class="btn secondary" type="button" id="cancelEditBtn" hidden>Edit रद्द करा</button><button class="btn" type="button" id="logoutBtn">Logout</button></div></form><p id="message" class="msg" role="status"></p><h2>बातम्या व्यवस्थापन</h2><div id="posts"></div></section></div></main><script src="/admin.js?v=20261118-5"></script></body></html>
