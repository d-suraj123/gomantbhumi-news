<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>बातमी | गोमंतभूमी</title><meta name="description" content="गोमंतभूमी बातमी"><link rel="stylesheet" href="/style.css"></head><body><header class="wrap mast"><a class="brand" href="/"><span class="mark">गो</span><span><b>गोमंतभूमी</b><small>गोव्याचा आवाज • जनतेचा विश्वास</small></span></a><a href="/">मुख्यपृष्ठ</a></header><main class="wrap"><article id="article" class="sidebox" style="padding:22px;margin:24px 0"><p class="muted">बातमी लोड होत आहे…</p></article></main><script>
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{let slug=new URLSearchParams(location.search).get("slug");let el=document.getElementById("article");if(!slug){el.textContent="बातमी सापडली नाही.";return;}try{let r=await fetch("/api/news?slug="+encodeURIComponent(slug));if(!r.ok)throw 0;let n=await r.json();document.title=n.title+" | गोमंतभूमी";el.innerHTML=`<span class="cat">${esc(n.category)}</span><h1>${esc(n.title)}</h1><p class="date">${esc(n.published_at||"")}</p>${n.image_url?`<img src="${esc(n.image_url)}" alt="${esc(n.title)}" style="max-width:100%;height:auto">`:""}<p style="font-size:18px;font-weight:600">${esc(n.summary)}</p><div style="white-space:pre-wrap;line-height:1.9">${esc(n.content)}</div>${n.video_url?`<p><a href="${esc(n.video_url)}" target="_blank" rel="noopener">▶ व्हिडिओ पाहा</a></p>`:""}`;}catch(e){el.textContent="ही बातमी उपलब्ध नाही.";}})();</script></body></html>
